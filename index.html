<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Постоянный редирект (301 Moved Permanently) -->
    <meta http-equiv="refresh" content="3; url=https://bardilovsky.github.io/">
    
    <!-- Канонический адрес нового сайта для поисковых систем -->
    <link rel="canonical" href="https://bardilovsky.github.io/">
    
    <!-- Сообщаем поисковикам, что страница переехала навсегда -->
    <meta name="robots" content="noindex, follow">
    
    <title>Сайт переехал — перенаправление...</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        
        .icon {
            font-size: 56px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .url {
            font-family: monospace;
            background: #f5f5f5;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            word-break: break-all;
        }
        
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container { padding: 32px 24px; }
            h1 { font-size: 20px; }
            .icon { font-size: 44px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Виртуальный кабинет переехал!</h1>
        <p>
            <span class="loader"></span>
            Сайт доступен по новому адресу. Если перенаправление не произошло автоматически, перейдите по ссылке ниже.
        </p>
        <a href="https://bardilovsky.github.io/" class="link" rel="noopener">Перейти на новый сайт</a>
        <p style="margin-top: 24px; margin-bottom: 0;">
            <span class="url">https://bardilovsky.github.io/</span>
        </p>
    </div>
</body>
</html>
